name: data-gov

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: data-gov-backend
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: data-gov-neo4j
      NEO4J_DATABASE: neo4j
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      SEARCH_CHROMA_DIR: /app/data/chroma
      SEARCH_EMBED_MODEL: BAAI/bge-small-zh-v1.5
      SEARCH_RERANK_THRESHOLD: "0.15"
      SEARCH_RRF_K: "60"
      AGENT_MAX_ITERATIONS: "3"
      GIT_AUTHOR_NAME: "Data-Gov Agent"
      GIT_AUTHOR_EMAIL: "agent@data-gov.local"
      # slice 2c sandbox
      SANDBOX_BASE_DIR: /tmp/sandbox
      SANDBOX_HDFS_BASE: /tmp/sandbox
      SANDBOX_TOTAL_TIMEOUT: "60"
      SANDBOX_COMPILE_TIMEOUT: "20"
      SANDBOX_SPARK_TIMEOUT: "30"
      SANDBOX_FLINK_TIMEOUT: "45"
      SANDBOX_MAX_RETRIES: "2"
      YARN_RM_URL: http://resourcemanager:8088
      HDFS_DEFAULTFS: hdfs://namenode:8020
      HIVE_METASTORE_URI: thrift://hive-metastore:9083
      SPARK_HOME: /opt/spark
      FLINK_HOME: /opt/flink
      HADOOP_HOME: /opt/hadoop
      HADOOP_CONF_DIR: /etc/hadoop
    volumes:
      - ./data/chroma:/app/data/chroma
      - ./.git:/app/.git
      - ./metadata-yaml:/app/metadata-yaml
      - ./templates:/app/templates:ro
      - ./docker/hadoop-conf:/etc/hadoop:ro
      - ./docker/sandbox-conf/log4j2.properties:/opt/spark/conf/log4j2.properties:ro
      - ./docker/sandbox-conf/log4j2.properties:/opt/flink/conf/log4j2.properties:ro
      - sandbox-tmp:/tmp/sandbox
    ports:
      - "8000:8000"
    networks:
      - default
      - shared-data-infra
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health | grep -q '\"status\":\"healthy\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  governance-server:
    profiles: ["governance"]
    build:
      context: ./data-gov-platform
      dockerfile: data-gov-server/Dockerfile
    container_name: data-gov-governance-server
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DATAGOV_GAUSSDB_JDBC_URL: "jdbc:h2:file:/app/data/data-gov;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH"
      DATAGOV_GAUSSDB_USER: sa
      DATAGOV_GAUSSDB_PASSWORD: ""
      DATA_GOV_KAFKA_BOOTSTRAP_SERVERS: ${DATA_GOV_KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
    volumes:
      - governance-server-data:/app/data
    ports:
      - "${DATA_GOV_SERVER_PORT:-8080}:8080"
    networks:
      - default
      - shared-data-infra
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  frontend:
    image: node:24-alpine
    container_name: data-gov-frontend
    working_dir: /app
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_BASE: http://localhost:8000
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  sandbox-tmp:
  governance-server-data:
  frontend-node-modules:

networks:
  default:
    name: data-gov_default
  shared-data-infra:
    external: true
    name: shared-data-infra
