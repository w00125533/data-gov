[project]
name = "data-gov"
version = "0.1.0"
description = "Wireless RNO Data Semantic Service"
requires-python = ">=3.11"

[project.optional-dependencies]
runtime = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "neo4j>=5.18",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
]
test = [
    "pytest>=7.4",
    "pytest-timeout>=2.2",
    "requests>=2.31",
    "kafka-python>=2.0.2",
    "PyMySQL>=1.1",
    "httpx>=0.27",
]
dev = [
    "data-gov[runtime,test]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300
addopts = "-v --tb=short"
markers = [
    "infra: integration tests requiring base-compose stack running",
]

[tool.setuptools.packages.find]
include = ["backend*"]
exclude = ["tests*"]
