server:
  port: 8080

spring:
  application:
    name: data-gov-server
  datasource:
    url: ${DATAGOV_GAUSSDB_JDBC_URL:jdbc:postgresql://localhost:5432/data_gov}
    username: ${DATAGOV_GAUSSDB_USER:data_gov}
    password: ${DATAGOV_GAUSSDB_PASSWORD:data_gov}
    driver-class-name: org.postgresql.Driver
  kafka:
    bootstrap-servers: ${DATA_GOV_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
        spring.json.trusted.packages: io.datagov.common.dto
  flyway:
    enabled: true
    locations: classpath:db/migration

data-gov:
  starrocks:
    jdbc-url: ${DATAGOV_STARROCKS_JDBC_URL:}
    username: ${DATAGOV_STARROCKS_USER:}
    password: ${DATAGOV_STARROCKS_PASSWORD:}
    query-timeout-seconds: ${DATAGOV_STARROCKS_QUERY_TIMEOUT_SECONDS:30}
    default-limit: ${DATAGOV_STARROCKS_DEFAULT_LIMIT:100}
    max-limit: ${DATAGOV_STARROCKS_MAX_LIMIT:5000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
