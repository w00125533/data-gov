server:
  port: 8080

spring:
  application:
    name: data-gov-server
  datasource:
    url: ${DATAGOV_GAUSSDB_JDBC_URL:jdbc:postgresql://localhost:5432/data_gov}
    username: ${DATAGOV_GAUSSDB_USER:data_gov}
    password: ${DATAGOV_GAUSSDB_PASSWORD:data_gov}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

data-gov:
  starrocks:
    jdbc-url: ${DATAGOV_STARROCKS_JDBC_URL:}
    username: ${DATAGOV_STARROCKS_USER:}
    password: ${DATAGOV_STARROCKS_PASSWORD:}
    query-timeout-seconds: ${DATAGOV_STARROCKS_QUERY_TIMEOUT_SECONDS:30}
    default-limit: ${DATAGOV_STARROCKS_DEFAULT_LIMIT:100}
    max-limit: ${DATAGOV_STARROCKS_MAX_LIMIT:5000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
